; jlx config tailored to Dia-Log JSON output.
;
; Dia-Log writes one JSON object per line with fields:
;   ts, level, logger, thread, msg, your key/value pairs, and (for exceptions)
;   errClass, errMessage, stack, errHash.
;
; Messages may contain {key} placeholders that reference the key/value pairs
; and MDC entries attached to the same event (e.g. "Request {method} {path}").
; Those tokens are written into JSON *as-is*. Setting `message_expand = curly`
; tells jlx to interpolate them using the other JSON fields on the same line,
; so the displayed message is human-readable while the stored log stays
; machine-readable.
;
; Usage (from the repo root):
;   jlx -c example/jlx.conf logs/example.jsonl
;   jlx -c example/jlx.conf -f logs/example.jsonl        # follow live output
;   jlx -c example/jlx.conf -p expanded logs/example.jsonl
;   ... Main | jlx -c example/jlx.conf                  # stdin: first section used
;
[folders]
; No `paths` key on purpose: this section is the fallback, matched in file mode
; for any log file whose parent directory matches no other section, and used
; unconditionally in stdin mode.
timestamp = ts
level     = level
message   = msg
thread    = thread
logger    = logger
trace     = stack
output    = {timestamp:datetime} [{level:6}] {logger} | {message}
; Expand {key} placeholders in msg using the line's key/value and MDC fields
message_expand = curly

[profile.expanded]
; Same as default, but expansion is explicitly enabled here too.
output    = {timestamp:datetime} [{level:6}] {logger} {thread} | {message}
message_expand = curly

[profile.errors]
output    = {timestamp:datetime} [{level:6}] {message}
include   = level:ERROR, level:WARN, errHash
exclude   = healthcheck
